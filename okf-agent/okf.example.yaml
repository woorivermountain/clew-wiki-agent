title: CLEW 설비 위키
output: ./output

# 설비 마스터 CSV와 PostgreSQL equipment 설정 중 하나를 선택합니다.
equipment_csv: ./equipment.csv

documents:
  root: ./originals
  kordoc: kordoc
  scope_from_path: false  # 허용된 설비 키가 폴더 경로의 처음에 있는 경우 true
  timeout_seconds: 120
  max_bytes: 67108864
  include_only_listed: true  # 목록에 지정한 원본만 수집
  files:
    C-2100-manual.pdf:
      equipment_ids: ["ULSAN/C-2100"]
      revision: "Rev.3"
      type: Maintenance Procedure
      # source_uri: https://documents.example.com/controlled/SOP-042/rev-3
      # ocr: true  # 스캔본 PDF 등에만 지정

