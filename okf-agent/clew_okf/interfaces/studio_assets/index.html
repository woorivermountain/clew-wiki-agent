<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CLEW 위키 작업실</title>
  <link rel="stylesheet" href="./studio/assets/studio.css">
  <link rel="stylesheet" href="./studio/assets/studio_palette.css">
  <link rel="stylesheet" href="./studio/assets/studio_evidence.css">
  <link rel="stylesheet" href="./studio/assets/studio_runs.css">
  <script defer src="./studio/assets/studio_graph.js"></script>
  <script defer src="./studio/assets/studio_lineage.js"></script>
  <script defer src="./studio/assets/studio_context.js"></script>
  <script defer src="./studio/assets/studio_palette.js"></script>
  <script defer src="./studio/assets/studio_runs.js"></script>
  <script defer src="./studio/assets/studio.js"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6a8 8 0 0 0-8-2v15a8 8 0 0 1 8 2 8 8 0 0 1 8-2V4a8 8 0 0 0-8 2Zm0 0v15"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m7.3 10.8 8.4-4.6m-8.4 7 8.4 4.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 10a7.6 7.6 0 1 0-.8 6.8M19.5 4.5V10H14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2H9l2 2h7.5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19ZM14 3.5V8h4m-9 4h6m-6 4h6"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m5-5-5 5 5 5"/></symbol>
    <symbol id="i-corner" viewBox="0 0 24 24"><path d="M6 18 18 6M9 6h9v9"/></symbol>
    <symbol id="i-lines" viewBox="0 0 24 24"><path d="M5 5h14M5 10h10M5 15h14M5 20h10"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-2.5-13-3 16"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5m0-8h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 4 9 15H3ZM12 10v3.5m0 2.7h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M9 5v14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <a class="skip-link" href="#primary">본문으로 이동</a>
  <header class="topbar">
    <div class="brand">
      <button class="icon-button mobile-control" id="explorer-toggle" type="button" aria-expanded="false" aria-controls="explorer" title="문서 탐색기">
        <svg aria-hidden="true"><use href="#i-panel"></use></svg><span class="sr-only">문서 탐색기</span>
      </button>
      <span class="brand-mark" aria-hidden="true"><svg><use href="#i-book"></use></svg></span>
      <div><div class="brand-name">CLEW</div><div class="brand-label">위키 작업실</div></div>
    </div>
    <nav class="workspace-nav" aria-label="작업실 보기">
      <button class="nav-tab" type="button" data-mode="lineage"><svg aria-hidden="true"><use href="#i-graph"></use></svg>데이터 흐름</button>
      <button class="nav-tab" type="button" data-mode="document" aria-current="page"><svg aria-hidden="true"><use href="#i-book"></use></svg>문서</button>
      <button class="nav-tab" type="button" data-mode="graph"><svg aria-hidden="true"><use href="#i-graph"></use></svg>연결 보기</button>
      <button class="nav-tab" type="button" data-mode="jobs"><svg aria-hidden="true"><use href="#i-clock"></use></svg>작업 기록 <span class="nav-count" id="job-count" hidden></span></button>
      <button class="nav-tab" type="button" data-mode="agent-runs"><svg aria-hidden="true"><use href="#i-code"></use></svg>에이전트 작동</button>
    </nav>
    <div class="top-actions">
      <button class="workspace-search" id="quick-find" type="button" title="빠른 문서 찾기">
        <svg aria-hidden="true"><use href="#i-search"></use></svg><span>문서 찾기</span><kbd aria-hidden="true">⌘ O</kbd>
      </button>
      <label class="release-picker" for="snapshot-view">
        <span class="snapshot-dot" aria-hidden="true"></span>
        <span class="sr-only">스냅샷 종류</span>
        <select id="snapshot-view"><option value="draft">검토용 초안</option><option value="approved">운영 승인본</option></select>
      </label>
      <button class="icon-button" type="button" id="refresh" title="데이터 새로고침"><svg aria-hidden="true"><use href="#i-refresh"></use></svg><span class="sr-only">데이터 새로고침</span></button>
    </div>
  </header>
  <div class="workspace" id="workspace" data-mode="document">
    <aside class="explorer" id="explorer" aria-label="문서 탐색기">
      <div class="pane-heading">
        <div><h2>탐색기</h2><span class="quiet-count" id="doc-count"></span></div>
        <button class="icon-button mobile-control" type="button" id="explorer-close" title="탐색기 닫기"><svg aria-hidden="true"><use href="#i-close"></use></svg><span class="sr-only">탐색기 닫기</span></button>
      </div>
      <label class="search-box">
        <svg aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="search" type="search" placeholder="문서 이름 또는 설비 검색" aria-label="문서 이름 또는 설비 검색">
        <kbd aria-hidden="true">⌘ K</kbd>
      </label>
      <div id="tree" class="document-tree" aria-live="polite"></div>
      <div class="explorer-footer" id="snapshot-meta"></div>
    </aside>
    <div class="workpane">
      <main class="primary" id="primary" tabindex="-1">
        <div class="document-tabs" id="document-tabs" role="tablist" aria-label="열린 문서" hidden></div>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="view"></div>
      </main>
      <section class="context-dock" id="context-dock" aria-label="관련 정보" hidden></section>
    </div>
    <aside class="inspector" aria-label="검토 및 근거">
      <div class="pane-heading"><div><h2 id="inspect-title">검토 및 근거</h2><span class="quiet-count" id="inspect-meta"></span></div></div>
      <div class="inspect-nav" id="inspect-nav" aria-label="상세 보기">
        <button type="button" class="inspect-tab" data-inspect="review" aria-pressed="true">검토</button>
        <button type="button" class="inspect-tab" data-inspect="evidence" aria-pressed="false">근거</button>
        <button type="button" class="inspect-tab" data-inspect="links" aria-pressed="false">참조</button>
        <button type="button" class="inspect-tab" data-inspect="preview" aria-pressed="false" hidden>나란히</button>
      </div>
      <div id="inspect-content" class="inspect-content" aria-live="polite"></div>
    </aside>
  </div>
  <footer class="status-bar" aria-label="스냅샷 상태"><div id="status-summary"></div><div id="status-id"></div></footer>
  <noscript><p>위키 탐색기를 사용하려면 JavaScript를 사용하도록 설정하세요.</p></noscript>
</body>
</html>
