# Copy to okf.service.local.yaml and supply real schema/DSN/model settings.
title: CLEW 제조 위키
output: ./output
postgres:
  name: factory
  dsn_env: CLEW_POSTGRES_DSN
  tables: []
  # Prefer an explicit mapping. When omitted, unique PK/FK evidence is required.
  # equipment:
  #   table: factory.equipment_master
  #   columns:
  #     equipment_id: asset_no
  #     name: asset_name
  #     plant_id: plant_code
bootstrap:
  schemas: [factory]
  max_tables: 200
  max_reports: 1000
  import_reports: true
service:
  state_dir: ./service-state
  bootstrap_on_startup: true
  max_upload_bytes: 67108864
  lease_seconds: 60
  poll_seconds: 1
synthesis:
  endpoint: https://llm-gateway.example.internal/v1/chat/completions
  model: your-approved-model
  api_key_env: CLEW_MODEL_API_KEY
  review: true
# Add documents/current procedural sources using okf.factory.example.yaml.
# To import old reports, explicitly map admission.reports or admission.mapping.database.
# New API uploads/text use the private service registry automatically.
# Incoming native reports default to draft/unapproved until trusted workflow approval.
