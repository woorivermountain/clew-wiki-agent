[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-okf-agent"
version = "0.1.0"
description = "Compile CLEW equipment, documents and database metadata into OKF v0.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "pydantic>=2.6,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
clew-okf = "clew_okf.cli:main"

[tool.setuptools.packages.find]
include = ["clew_okf*"]
